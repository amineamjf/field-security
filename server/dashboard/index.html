<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المدير</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f3f5f7;color:#1c2430}
  header{padding:12px 20px;background:#1c2430;color:#fff}
  .grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px;padding:16px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  #map{height:460px;border-radius:8px}
  section{background:#fff;border-radius:8px;padding:12px}
  h2{margin:0 0 8px;font-size:16px}
  .dev{border-bottom:1px solid #e3e7ec;padding:8px 0}
  .dev small{color:#66717f;display:block}
  button{padding:6px 12px;border:0;border-radius:6px;background:#3d6fd1;color:#fff;margin:4px 4px 0 0;cursor:pointer}
  button.stop{background:#c0392b}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .gallery figure{margin:0}
  .gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
  figcaption{font-size:12px;color:#66717f}
  .flag{color:#c0392b}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:4px 6px;border-bottom:1px solid #e3e7ec;text-align:start}
</style>
</head>
<body>
<header><strong>لوحة المدير</strong></header>
<div class="grid">
  <div>
    <section><div id="map"></div></section>
    <section style="margin-top:16px"><h2>السجلات</h2>
      <table><thead><tr><th>العامل</th><th>الوقت</th><th>الوضع</th><th>ملاحظات</th></tr></thead><tbody id="rows"></tbody></table>
    </section>
  </div>
  <div>
    <section><h2>العمال</h2><div id="devices"></div></section>
    <section style="margin-top:16px"><h2>الصور الميدانية</h2><div class="gallery" id="gallery"></div></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const KEY = sessionStorage.getItem('adminKey') || prompt('مفتاح المدير:');
sessionStorage.setItem('adminKey', KEY || '');
const api = (p, o = {}) => fetch('/api/' + p, { ...o, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY } }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const modeName = { invoices: 'توزيع الفواتير', meters: 'جرد العدادات' };

const map = L.map('map').setView([24.7136, 46.6753], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
let fitted = false, names = {};

async function setCmd(deviceId, body) { await api('command', { method: 'POST', body: JSON.stringify({ deviceId, ...body }) }); refresh(); }
window.setCmd = setCmd;

async function refresh() {
  try {
    const [devices, records] = await Promise.all([api('devices'), api('records?limit=100')]);
    names = Object.fromEntries(devices.map((d) => [d.id, d.name]));

    $devices.innerHTML = devices.map((d) => {
      const ago = d.seen ? Math.round((Date.now() - d.seen.at) / 60000) : null;
      const lost = ago === null || ago > 5;
      return `<div class="dev"><strong>${esc(d.name)}</strong>
        <small class="${lost ? 'flag' : ''}">${ago === null ? 'لم يتصل بعد' : `آخر اتصال قبل ${ago} د`}${d.seen?.battery != null ? ` · بطارية ${Math.round(d.seen.battery * 100)}%` : ''}</small>
        <small>الحالة: ${d.command.state === 'stopped' ? 'موقوف' : 'يعمل'} · ${modeName[d.command.mode]}</small>
        <button onclick="setCmd('${esc(d.id)}',{state:'running'})">تشغيل</button>
        <button class="stop" onclick="setCmd('${esc(d.id)}',{state:'stopped'})">إيقاف</button>
        <button onclick="setCmd('${esc(d.id)}',{mode:'invoices'})">فواتير</button>
        <button onclick="setCmd('${esc(d.id)}',{mode:'meters'})">عدادات</button></div>`;
    }).join('');

    layer.clearLayers();
    const pts = [];
    records.forEach((r) => {
      if (r.lat == null) return;
      pts.push([r.lat, r.lng]);
      L.marker([r.lat, r.lng]).addTo(layer).bindPopup(`<b>${esc(names[r.deviceId])}</b><br>${new Date(r.ts).toLocaleString('ar')}<br><img src="${esc(r.img)}" width="180">`);
    });
    if (pts.length && !fitted) { map.fitBounds(pts, { padding: [30, 30] }); fitted = true; }

    $rows.innerHTML = records.slice(0, 30).map((r) => `<tr><td>${esc(names[r.deviceId])}</td><td>${new Date(r.ts).toLocaleTimeString('ar')}</td><td>${modeName[r.mode] || ''}</td><td class="flag">${esc(r.flags.join(', '))}</td></tr>`).join('');
    $gallery.innerHTML = records.slice(0, 24).map((r) => `<figure><a href="${esc(r.img)}" target="_blank"><img loading="lazy" src="${esc(r.img)}"></a><figcaption>${esc(names[r.deviceId])} · ${new Date(r.ts).toLocaleTimeString('ar')}</figcaption></figure>`).join('') || 'لا توجد صور بعد';
  } catch (e) { if (e.message === '401') { sessionStorage.removeItem('adminKey'); location.reload(); } }
}
const $devices = document.getElementById('devices'), $rows = document.getElementById('rows'), $gallery = document.getElementById('gallery');
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
