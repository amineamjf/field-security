<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جولة ميدانية</title>
<style>
  body{margin:0;font:16px/1.6 system-ui,sans-serif;background:#12161c;color:#e8ecf1;display:grid;place-items:center;min-height:100vh}
  main{width:min(92vw,420px)}
  button{width:100%;padding:16px;font-size:18px;border:0;border-radius:10px;background:#2f9e6f;color:#fff;margin:8px 0}
  button:disabled{background:#3a414b;color:#8a94a1}
  button.alt{background:#3d6fd1}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;color:#9aa5b1;font-size:14px}
  dd{margin:0;color:#e8ecf1}
  #msg{min-height:1.6em;color:#f2c14e}
</style>
</head>
<body>
<main>
  <h1>جولة ميدانية</h1>
  <p id="msg">جاهز</p>
  <button id="start">بدء الجولة</button>
  <button id="shot" class="alt" hidden>التقاط قراءة العداد</button>
  <dl>
    <dt>الوضع</dt><dd id="mode">-</dd>
    <dt>الموقع</dt><dd id="gps">-</dd>
    <dt>بانتظار الرفع</dt><dd id="queue">0</dd>
    <dt>آخر مزامنة</dt><dd id="last">-</dd>
  </dl>
</main>
<video id="v" playsinline muted style="position:fixed;width:1px;height:1px;opacity:0"></video>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.1.0/dist/blazeface.min.js"></script>
<script>
// ========= الإعداد: ?device=dev-001&secret=change-me-001&fast=1 (يُحفظ محلياً) =========
const q = new URLSearchParams(location.search);
for (const k of ['device', 'secret']) if (q.get(k)) localStorage.setItem(k, q.get(k));
const DEVICE = localStorage.getItem('device'), SECRET = localStorage.getItem('secret');
const FAST = q.get('fast') === '1';                      // للتجربة: 10-20 ثانية بدل 5-20 دقيقة
const MIN_MS = FAST ? 10e3 : 5 * 60e3, MAX_MS = FAST ? 20e3 : 20 * 60e3;
const $ = (id) => document.getElementById(id);
const say = (t) => ($('msg').textContent = t);

let running = false, allowed = true, mode = 'invoices', timer = null, model = null, pos = null, stream = null;

// ========= توقيع HMAC (كشف التلاعب) =========
const enc = new TextEncoder();
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
const sha256 = async (s) => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
async function hmac(msg) {
  const key = await crypto.subtle.importKey('raw', enc.encode(SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return hex(await crypto.subtle.sign('HMAC', key, enc.encode(msg)));
}

// ========= IndexedDB: طابور المزامنة =========
const dbp = new Promise((ok, no) => {
  const r = indexedDB.open('field', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('queue', { keyPath: 'id' });
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const tx = async (mode, fn) => { const d = await dbp; return new Promise((ok, no) => { const t = d.transaction('queue', mode); const req = fn(t.objectStore('queue')); t.oncomplete = () => ok(req?.result); t.onerror = () => no(t.error); }); };
const qPut = (r) => tx('readwrite', (s) => s.put(r));
const qAll = () => tx('readonly', (s) => s.getAll());
const qDel = (id) => tx('readwrite', (s) => s.delete(id));
const refreshQueue = async () => ($('queue').textContent = (await qAll()).length);

// ========= الموقع =========
function watchGps() {
  navigator.geolocation.watchPosition(
    (p) => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() }; $('gps').textContent = `${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`; },
    () => ($('gps').textContent = 'غير متاح'), { enableHighAccuracy: true, maximumAge: 10000 });
}

// ========= الالتقاط + طمس الوجوه =========
async function capture() {
  if (!model) { say('نموذج الطمس غير جاهز: لا يُحفظ أي التقاط بدونه'); return; }
  const v = $('v'), c = document.createElement('canvas');
  const scale = Math.min(1, 1280 / v.videoWidth);
  c.width = v.videoWidth * scale; c.height = v.videoHeight * scale;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, c.width, c.height);

  const faces = await model.estimateFaces(c, false);
  const src = document.createElement('canvas'); src.width = c.width; src.height = c.height;
  src.getContext('2d').drawImage(c, 0, 0);
  for (const f of faces) {                                 // تحويل كل وجه إلى بكسلات كبيرة
    const [x1, y1] = f.topLeft, [x2, y2] = f.bottomRight, w = x2 - x1, h = y2 - y1;
    const x = Math.max(0, x1 - w * .4), y = Math.max(0, y1 - h * .4), ww = w * 1.8, hh = h * 1.8;
    const t = document.createElement('canvas'); t.width = 8; t.height = Math.max(2, Math.round(8 * hh / ww));
    t.getContext('2d').drawImage(src, x, y, ww, hh, 0, 0, t.width, t.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(t, 0, 0, t.width, t.height, x, y, ww, hh);
  }
  const image = c.toDataURL('image/jpeg', 0.7);
  const rec = { id: crypto.randomUUID(), ts: Date.now(), lat: pos?.lat ?? null, lng: pos?.lng ?? null, acc: pos?.acc ?? null, mode, image };
  rec.sig = await hmac(`${rec.id}|${rec.ts}|${rec.lat}|${rec.lng}|${await sha256(image)}`);
  await qPut(rec);
  await refreshQueue();
  say(`تم الحفظ (وجوه مطموسة: ${faces.length})`);
  sync();
}

// ========= المؤقت العشوائي =========
function schedule() {
  clearTimeout(timer);
  if (!running || mode !== 'invoices') return;
  const delay = MIN_MS + Math.random() * (MAX_MS - MIN_MS);
  timer = setTimeout(async () => { try { await capture(); } finally { schedule(); } }, delay);
}

// ========= المزامنة والأوامر =========
function applyCommand(cmd) {
  allowed = cmd.state !== 'stopped';
  if (!allowed && running) stop();
  if (cmd.mode !== mode) { mode = cmd.mode; schedule(); }
  $('mode').textContent = mode === 'invoices' ? 'توزيع الفواتير' : 'جرد العدادات';
  $('shot').hidden = !(running && mode === 'meters');
  $('start').disabled = !allowed;
  if (!allowed) say('أوقف المشرف الجولة');
}

async function sync() {
  if (!navigator.onLine || !DEVICE) return;
  try {
    const records = await qAll();
    const res = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId: DEVICE, records }) });
    if (!res.ok) throw new Error(res.status);
    const { accepted, command } = await res.json();
    for (const id of accepted) await qDel(id);
    await refreshQueue(); applyCommand(command);
    $('last').textContent = new Date().toLocaleTimeString('ar');
  } catch { /* نعيد المحاولة في الدورة القادمة */ }
}

async function heartbeat() {
  if (!navigator.onLine || !DEVICE) return;
  try {
    const ts = Date.now(), battery = (await navigator.getBattery?.())?.level ?? null;
    const res = await fetch('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId: DEVICE, ts, lat: pos?.lat, lng: pos?.lng, battery, sig: await hmac(`${DEVICE}|${ts}`) }) });
    if (res.ok) applyCommand((await res.json()).command);
  } catch {}
}

// ========= بدء/إيقاف =========
async function start() {
  if (!DEVICE || !SECRET) return say('أضف ?device=...&secret=... للرابط أول مرة');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    $('v').srcObject = stream; await $('v').play();
    say('جارٍ تحميل نموذج الطمس...');
    model = model || await blazeface.load();
    watchGps(); running = true; schedule();
    $('start').textContent = 'الجولة تعمل'; $('start').disabled = true;
    applyCommand({ state: 'running', mode }); say('الجولة تعمل');
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
  } catch (e) { say('تعذّر البدء: ' + e.message); }
}
function stop() {
  running = false; clearTimeout(timer);
  stream?.getTracks().forEach((t) => t.stop());
  $('start').textContent = 'بدء الجولة';
}

$('start').onclick = start;
$('shot').onclick = capture;
addEventListener('online', () => { heartbeat(); sync(); });
setInterval(() => { heartbeat(); sync(); }, FAST ? 15e3 : 60e3);
refreshQueue(); heartbeat();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
