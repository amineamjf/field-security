services:
  - type: web
    name: field-security
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cp -r server/worker-app worker-app && cp -r server/dashboard dashboard && cd server && node index.js
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: SECRET_DEV1
        sync: false
      - key: SECRET_DEV2
        sync: false
